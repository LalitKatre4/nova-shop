name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        env:
          VITE_APP_BASE_URL: /nova-shop/

          VITE_AI_API_URL: https://novashop-gemini.novashop-ai.workers.dev
        run: bun run build

      - name: Find build output
        run: |
          echo "=== Build directories ==="
          find . -maxdepth 4 -type d \( -name "dist" -o -name "public" -o -name ".output" \) -print

          echo "=== HTML files ==="
          find . -maxdepth 6 -name "index.html" -print

      - name: Prepare GitHub Pages artifact
        run: |
          INDEX_FILE=$(find . -maxdepth 6 -name "index.html" -not -path "./node_modules/*" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No index.html found after build."
            exit 1
          fi

          echo "Found: $INDEX_FILE"

          OUTPUT_DIR=$(dirname "$INDEX_FILE")

          echo "Uploading: $OUTPUT_DIR"

          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
